name: Build and Push Docker Images

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
        branches:
            - main


env:
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}


jobs:
    build-and-push:
        runs-on: self-hosted
        strategy:
            fail-fast: false
            matrix:
                service:
                    - name: auth-service
                      context: ./services/auth
                      dockerfile: ./services/auth/Dockerfile
                    - name: diary-service
                      context: ./services/diary
                      dockerfile: ./services/diary/Dockerfile
                    - name: frontend
                      context: ./services/frontend
                      dockerfile: ./services/frontend/Dockerfile
                    - name: streak
                      context: ./services/streak
                      dockerfile: ./services/streak/Dockerfile
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              
            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Login to Docker Hub
              if: github.event_name !='pull-request'
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}
            - name: Extract Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{env.DOCKERHUB_USERNAME}}/${{matrix.service.name}}
                tags: |
                    type=sha,format=short,prefix=sha-
                    type=semver,pattern={{version}}
                    type=semver,pattern={{major}}.{{minor}}
                    type=ref,event=branch
                    type=raw,value=latest,enable=${{github.ref=='refs/head/main'}}
            
            - name: Build and push image
              uses: docker/build-push-action@v5
              with:
                context: ${{matrix.service.context}}
                file: ${{matrix.service.dockerfile}}
                push: ${{github.event_name != 'pull_request'}}
                tags: ${{steps.meta.outputs.tags}}
                labels: ${{steps.meta.outputs.labels}}
                #Local Cachging on the self hosted runner to speed up builds
                cache-from: type=gha
                cache-to: type=gha,mode=max